name: CI

# The gate CONTRIBUTING.md's pre-PR checklist describes. Until this existed, every
# check in that list was enforced by discipline alone.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch supersedes the run in flight — a PR that gets three
# commits in a minute should burn one runner, not three.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from `rust` on purpose: the two fail for unrelated reasons, and a red check
  # should say which half broke without anyone opening the log.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" — do not also set `version:`
      # here, action-setup errors on two sources (same note as release.yml).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm test

      # Catches what a typecheck cannot: a bad import path, a Vite plugin
      # misconfiguration, a Monaco chunk that fails to resolve.
      - name: Build
        run: pnpm build

  rust:
    # Both shipping platforms, because they compile DIFFERENT programs. Whole modules
    # are cfg-gated (`tmux`, `session_budget`) and the spawn, PTY, path, and
    # process-kill paths each have a Windows arm that a macOS run never type-checks.
    # That is not hypothetical: the Windows build was broken for 76 commits behind a
    # macOS-only gate, because an inner `#![cfg(not(windows))]` contradicted the
    # `allow(dead_code)` at the mod site and nothing ever compiled it.
    #
    # Linux is deliberately absent: nothing ships there, so it would be a third
    # program to keep green for no user.
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Without this the two legs collide on one cache key and each restores the
          # other's target dir.
          key: ${{ matrix.os }}

      # Formatting has no platform arm, so checking it twice would only buy a slower
      # red. One leg owns it.
      - name: Format
        if: matrix.os == 'macos-latest'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # -D warnings from the start: a warning-tolerant lint job stops being read within
      # a month. If the tree does not pass on the first run, fix the lints rather than
      # weakening this line. Per-platform, because a lint inside a `#[cfg(windows)]`
      # block is invisible to the macOS leg -- exactly how two of them survived.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
